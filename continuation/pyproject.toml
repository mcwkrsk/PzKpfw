[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "is2-re-analysis-kit"
version = "0.3.0"
description = "IS-2 XML reader, validator, editor, and conservative writer"
requires-python = ">=3.10"

[project.scripts]
is2-project = "is2_re.cli:main"
is2-studio = "is2_re.gui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
