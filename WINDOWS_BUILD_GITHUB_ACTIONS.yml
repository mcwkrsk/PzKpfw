name: Build PzKpfw Standalone EXE
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependency
        run: python -m pip install --upgrade pyinstaller
      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name PzKpfw --icon 'src/is2_re/assets/pzkpfw.ico' --paths src --add-data 'src/is2_re/assets;is2_re/assets' tools/pzkpfw_standalone_entry.py
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: PzKpfw-Windows-x64
          path: dist/PzKpfw.exe
