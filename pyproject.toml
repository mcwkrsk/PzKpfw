[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pzkpfw"
version = "0.7.9"
description = "Open-source desktop editor and XML toolkit for IS-2 project files"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "PzKpfw contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: Tk",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
pzkpfw-project = "is2_re.cli:main"
pzkpfw = "is2_re.gui:main"
# Backward-compatible command names retained for existing installations.
is2-project = "is2_re.cli:main"
is2-studio = "is2_re.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
