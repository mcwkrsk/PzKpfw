name: PzKpfw source CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test/build tools
        run: python -m pip install --upgrade pip setuptools 'pytest>=8'
      - name: Run regression tests
        run: python -m pytest -q
      - name: Run GUI smoke test under Xvfb
        run: xvfb-run -a python tools/smoke_gui.py samples/kursach_user_supplied_42_actions.is2
      - name: Build wheel from source
        run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist
      - name: Verify public source packaging rules
        run: python tools/package_source_release.py --output-dir /tmp/pzkpfw-release

  native-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile native ABI/layout probes
        run: |
          mkdir -p /tmp/pzkpfw-native
          for source in tests/native/*.cpp; do
            name=$(basename "$source" .cpp)
            g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. -Isrc/native -Isdk "$source" -o "/tmp/pzkpfw-native/$name"
            "/tmp/pzkpfw-native/$name"
          done
