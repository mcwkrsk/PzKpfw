name: Release installer

# Tag push vX.Y.Z  -> build, test the installer on Windows, publish a GitHub release.
# Manual run       -> the same build and test; files are kept as a workflow artifact only.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    env:
      PYTHON_STANDALONE: '3.12'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download standalone Python for the runtime
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check uv
          $env:UV_PYTHON_INSTALL_DIR = "$env:RUNNER_TEMP\pbs"
          uv python install "cpython-$env:PYTHON_STANDALONE-windows-x86_64-none"
          $dir = Get-ChildItem "$env:RUNNER_TEMP\pbs" -Directory -Filter 'cpython-*' | Select-Object -First 1
          if (-not (Test-Path "$($dir.FullName)\pythonw.exe")) { throw "standalone Python not found" }
          "PBS_DIR=$($dir.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build runtime and installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: python installer/build_release.py --python-dir "$env:PBS_DIR" --repository "${{ github.repository }}"

      - name: Run tests with the packaged runtime
        shell: pwsh
        env:
          PYTHONPATH: src
        run: |
          & build\release\runtime\python.exe -m unittest discover -s tests -p "test_*.py"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & build\release\runtime\python.exe tools\smoke_gui.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # The runtime ZIP lies next to the installer, so no download is needed here.
      - name: Install silently, start, uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist-installer -Filter 'PzKpfw-Setup-*.exe' | Select-Object -First 1
          $dir = "$env:RUNNER_TEMP\PzKpfw-test"
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOLAUNCH',"/DIR=$dir",'/LOG=install.log' -Wait -PassThru
          Get-Content install.log -Tail 40
          if ($p.ExitCode) { throw "installer exit code $($p.ExitCode)" }
          foreach ($f in 'runtime\pythonw.exe','runtime\pzkpfw-runtime.id','app\is2_re\gui.py','pzkpfw.pyw','pzkpfw-install.json') {
            if (-not (Test-Path "$dir\$f")) { throw "missing after install: $f" }
          }
          $env:PZKPFW_INSTALL_DIR = $dir
          & "$dir\runtime\python.exe" -c "import sys; sys.path.insert(0, r'$dir\app'); import tkinter, docx, PIL, is2_re.gui; from is2_re import installation; assert installation.is_installed_copy(); print('installed copy OK', is2_re.__version__)"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:PYTHONPATH = "$dir\app"
          & "$dir\runtime\python.exe" tools\smoke_gui.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Second run of the same installer must reuse the runtime (no download, no unpack).
          $stamp = (Get-Item "$dir\runtime\pythonw.exe").LastWriteTimeUtc
          Rename-Item "dist-installer\$((Get-Content dist-installer\build-info.json | ConvertFrom-Json).RuntimeFile)" 'runtime-hidden.zip'
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOLAUNCH',"/DIR=$dir" -Wait -PassThru
          if ($p.ExitCode) { throw "update over the same runtime failed: $($p.ExitCode)" }
          Rename-Item 'dist-installer\runtime-hidden.zip' (Get-Content dist-installer\build-info.json | ConvertFrom-Json).RuntimeFile
          if ((Get-Item "$dir\runtime\pythonw.exe").LastWriteTimeUtc -ne $stamp) { throw "runtime was reinstalled" }
          $p = Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\runtime") { throw "runtime left after uninstall" }
          Write-Host "install / update / uninstall OK"

      # Code signing (SignPath Foundation) goes here once the project is accepted:
      # sign dist-installer\PzKpfw-Setup-*.exe, then regenerate SHA256SUMS.txt.

      - uses: actions/upload-artifact@v4
        with:
          name: PzKpfw-installer
          path: |
            dist-installer/PzKpfw-Setup-*.exe
            dist-installer/PzKpfw-runtime-*.zip
            dist-installer/SHA256SUMS.txt

      - name: Attach files to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-installer/PzKpfw-Setup-*.exe
            dist-installer/PzKpfw-runtime-*.zip
            dist-installer/SHA256SUMS.txt
